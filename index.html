<title>MOREHOUSE MORE PROBLEMS - A SHADYNASTY Production</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07070c;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Arial Black",Impact,Arial,sans-serif;color:#fff}
html,body{overscroll-behavior:none;position:fixed;inset:0;width:100%;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);touch-action:none}
#wrap{position:relative;line-height:0;flex:none}
canvas{display:block;touch-action:none;border-radius:6px;box-shadow:0 0 24px rgba(255,200,0,.22)}
.hudbtn{position:absolute;top:6px;width:38px;height:38px;border-radius:50%;border:2px solid #ffd400;background:rgba(0,0,0,.6);color:#ffd400;font-size:17px;line-height:34px;text-align:center;cursor:pointer;padding:0;font-family:Arial,sans-serif;font-weight:bold;touch-action:manipulation;z-index:4}
#muteBtn{right:6px}#musicBtn{right:50px}
.ovl{position:absolute;display:none;z-index:5;font-family:"Arial Black",Impact,Arial,sans-serif;line-height:1.15;touch-action:manipulation;cursor:pointer}
.bigbtn{min-height:52px;padding:8px 10px;border-radius:14px;border:3px solid #fff;color:#fff;font-size:clamp(13px,3.9vw,18px);box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 16px rgba(255,212,0,.5)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
#shareBtn{background:#c21}
#againBtn{background:#1a7a2a}
#hsPanel{left:50%;top:50%;transform:translate(-50%,-50%);width:90%;padding:14px 8px;border-radius:14px;border:3px solid #ffd400;background:rgba(12,0,24,.97);color:#ffd400;text-align:center;font-size:clamp(14px,4.2vw,19px);box-shadow:0 0 40px rgba(255,212,0,.45);cursor:default}
#hsPanel small{display:block;color:#fff;font-size:.7em;margin-top:4px}
#hsIn{width:4.4em;font:inherit;font-size:1.8em;text-align:center;text-transform:uppercase;letter-spacing:.2em;background:#111;color:#fff;border:2px solid #ffd400;border-radius:10px;margin:10px 6px 0;padding:4px 0 4px .2em;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#hsOk{font:inherit;font-size:1.15em;min-height:50px;padding:8px 18px;border-radius:10px;border:2px solid #fff;background:#c21;color:#fff;cursor:pointer;vertical-align:bottom}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="c" aria-label="Morehouse More Problems game"></canvas>
    <button class="hudbtn" id="muteBtn" aria-label="Mute all sound (M)">&#128266;</button>
    <button class="hudbtn" id="musicBtn" aria-label="Toggle music (N)">&#9835;</button>
    <button class="ovl bigbtn" id="shareBtn" aria-label="Share your score">&#128227; SHARE</button>
    <button class="ovl bigbtn" id="againBtn" aria-label="Play again">&#127944; AGAIN</button>
    <div class="ovl" id="hsPanel" role="dialog" aria-label="New high score">TOP 10! ENTER YOUR INITIALS
      <small>HALL OF SHAME &bull; SAVED ON THIS DEVICE ONLY</small>
      <input id="hsIn" maxlength="3" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="AAA" aria-label="Initials"><button id="hsOk">SAVE</button>
    </div>
  </div>
</div>

// ---------- spawning ----------
function freeHoles(){return holes.filter(h=>!h.item&&h.cool<=0)}
function spawn(kind,hi_,opt){
  const fh=hi_!=null?[holes[hi_]]:freeHoles();if(!fh.length)return null;const h=pick(fh);if(h.item)return null;
  const q=quarter,lifeMul=[1,0.88,0.76,0.66][q-1]||0.66;let it;
  if(kind==='boss')it={kind:'boss',boss:true,life:4.2,hp:5,maxhp:5,pts:200};
  else if(kind==='star'){const s=(opt&&opt.star)||pick(STARS);it={kind:'star',star:s,life:1.55*lifeMul+0.2,pts:-300}}
  else{const d=PROB[kind];it={kind,def:d,life:d.life*lifeMul,pts:d.pts}}
  Object.assign(it,{t:0,ph:'rise',rise:0,hitT:0,jit:0,hole:h.i,seed:R()});
  h.item=it;SND.pop();return it;
}
function step(dt){
  stateT+=dt;
  if(state==='play')stepPlay(dt);
  for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<p.life);
  for(const m of hammers)m.t+=dt;hammers=hammers.filter(m=>m.t<0.45);
  if(banner){banner.t+=dt;if(banner.t>banner.life)banner=null}
  if(ticker){ticker.t+=dt;if(ticker.t>3.6)ticker=null}
  for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=60*dt;c.r+=c.vr*dt}confetti=confetti.filter(c=>c.y<H+20);
  shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt*2.5);cameoT=Math.max(0,cameoT-dt);
  if(state==='hike'&&stateT>1.5){go('play');music()}
  music();updateOverlays();
}
function stepPlay(dt){
  gT+=dt;const q=Math.min(4,1+Math.floor(gT/QLEN));
  if(q!==quarter){quarter=q;SND.quarter();AUD.sting('a_q'+q,{vol:1.3,delay:0.2});pop(W/2,FT+40,'Q'+q+': SPEED UP!','#ffd400',26,1.4)}
  if(fireT>0){fireT-=dt;if(fireT<=0){fireT=0;showBanner('FIRE\'S OUT. JOE IS STILL BAD.','#fa6',1.4)}}
  // spawns
  spawnT-=dt;const up=holes.filter(h=>h.item).length,maxUp=[3,4,5,6][quarter-1];
  if(spawnT<=0&&up<maxUp){spawnT=[0.92,0.76,0.62,0.5][quarter-1]*rnd(0.7,1.25)*(fireT>0?0.75:1);
    const dec=[0.14,0.17,0.2,0.23][quarter-1];spawn(R()<dec?'star':pickProb())}
  if(bossDue.length&&gT>=bossDue[0]&&!holes.some(h=>h.item&&h.item.boss)){if(spawn('boss')){bossDue.shift();SND.boss();AUD.sting('a_boss',{vol:1.3,delay:0.1});AUD.heckle('BOSS',true)}}
  else if(bossDue.length&&gT>bossDue[0]+6)bossDue.shift();
  for(const h of holes){h.cool-=dt;const it=h.item;if(!it)continue;it.t+=dt;it.jit=Math.max(0,it.jit-dt*4);
    if(it.ph==='rise'){it.rise=Math.min(1,it.rise+dt*7);if(it.rise>=1)it.ph='up'}
    else if(it.ph==='up'){if(it.t>it.life){it.ph='down';if(it.kind!=='star'){if(combo>=5)pop(h.x,h.y-CH*0.6,'COMBO LOST','#aaa',14);combo=0;if(it.boss)pop(h.x,h.y-CH*0.7,'JOE ESCAPED TO THE WAIVER WIRE','#aaa',13,1.4)}}}
    else if(it.ph==='down'){it.rise-=dt*6;if(it.rise<=0){h.item=null;h.cool=0.25}}
    else if(it.ph==='hit'){it.hitT+=dt;if(it.hitT>0.32){h.item=null;h.cool=0.3}}
    if(it.kind==='caleb'&&it.ph==='up'&&Math.random()<dt*0.5)AUD.heckle('CALEB')}
  if(gT>nextAmb){nextAmb=gT+rnd(5,8);AUD.heckle(R()<0.4?'ambient':'whack')}
  if(gT>=ROUND)endGame('FINAL WHISTLE');
}

function whackAt(x,y){
  if(state!=='play'||hsEntering)return;
  let h=null;for(const o of holes){if(x>=o.cx&&x<o.cx+CW&&y>=o.cy&&y<o.cy+CH){h=o;break}}
  hammers.push({x,y,t:0,id:R()});
  const it=h&&h.item;
  if(!it||!(it.ph==='up'||(it.ph==='rise'&&it.rise>0.3))){whiffs++;SND.whiff();if(combo>=3)pop(x,y-20,'WHIFF! COMBO RESET','#aaa',13);else pop(x,y-20,'WHIFF','#aaa',13,0.5);combo=0;return}
  whacks++;
  if(it.kind==='star'){
    it.ph='hit';it.hitT=0;strikes++;decoysHit++;combo=0;score=Math.max(0,score-300);shake=10;flash=1;flashCol='#f00';SND.decoy();
    const ln=HECKLES.find(x=>x.k===it.star.k);pop(W/2,h.y-CH*0.5,ln?ln.t.toUpperCase():'YOU BENCHED A STAR?!','#f44',17,1.8);pop(h.x,h.y-CH*0.9,'-300 FLAG!','#f44',18);
    AUD.sting(it.star.k,{vol:1.4,delay:0.25,quiet:true});
    if(strikes>=3)setTimeout(()=>{if(state==='play')endGame('3 FLAGS: YOU BENCHED BRETT\'S STARS')},650);
    return}
  if(it.boss){
    it.hp--;it.jit=1;SND.bossHit();shake=5;const m=mult();score+=Math.round(it.pts*m);addProblems(1,6);combo++;comboTick();
    pop(h.x,h.y-CH*0.9,pick(['WAAAH!','BOO HOO!','NOT THE HEADSET!','*SOBS*']),'#7cf',17);
    if(it.hp<=0){it.ph='hit';it.hitT=0;bossesBeat++;const b=Math.round(1000*m);score+=b;addProblems(5,30);SND.bossKill();
      showBanner('JOE MOREHOUSE: FIRED!  +'+b,'#ffd400',2);burst(50);setTimeout(()=>{AUD.sting('eatshit',{vol:1.4})||AUD.heckle('BOSSHIT',true)},500)}
    else if(R()<0.5)AUD.heckle('BOSSHIT',true);
    return}
  it.ph='hit';it.hitT=0;combo++;const m=mult(),pts=Math.round(it.pts*m);score+=pts;
  const big=it.kind==='caleb';SND.whack(big);if(big){shake=4;AUD.SFX.sackChant(2)}
  pop(h.x,h.y-CH*0.95,it.def.word,big?'#ff4':'#fff',big?20:16);pop(h.x,h.y-CH*0.6,'+'+pts+(m>1?' x'+m:''),'#ffd400',15);
  addProblems(1,it.def.meter);comboTick();
  if(R()<0.4)AUD.heckle(it.def.grp,R()<0.5);
}
function comboTick(){comboBest=Math.max(comboBest,combo);

  if(C[combo]){AUD.sting(C[combo][0],{vol:1.35,throttle:1500,delay:0.1});cameoT=1.2;if(combo===20)SND.chant(1.6)}
  else if(combo>20&&combo%10===0){AUD.sting('a_mmp',{vol:1.35,delay:0.1});SND.chant(1.6);cameoT=1.2}
  else if(combo%5===0&&combo)cameoT=0.8}

// ---------- drawing helpers ----------
function txt(s,x,y,size,col,align,stroke,sw){ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=sw||Math.max(2,size/6);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y)}ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function fit(s,x,y,size,maxW,col,stroke,align){ctx.font=`900 ${size}px ${FONT}`;const w=ctx.measureText(s).width;if(w>maxW)size*=maxW/w;txt(s,x,y,size,col,align,stroke)}
function wrapTxt(s,x,y,size,maxW,col,stroke,lh){ctx.font=`900 ${size}px ${FONT}`;const words=s.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);
  lh=lh||size*1.15;const y0=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>fit(l,x,y0+i*lh,size,maxW,col,stroke));return lines.length}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function football(x,y,s,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.fillStyle='#8b4a1f';ctx.strokeStyle='#4a2008';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(0,0,s,s*0.6,0,0,6.283);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(0.8,s*0.14);ctx.beginPath();ctx.moveTo(-s*0.4,0);ctx.lineTo(s*0.4,0);ctx.stroke();
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*s*0.2,-s*0.18);ctx.lineTo(i*s*0.2,s*0.18);ctx.stroke()}ctx.restore()}
function photoFrame(x,y,w,h,glow){ctx.save();if(glow){ctx.shadowColor='#ffd400';ctx.shadowBlur=glow}ctx.fillStyle='#ffd400';rr(x-4,y-4,w+8,h+8,10);ctx.fill();ctx.restore();
  ctx.save();rr(x,y,w,h,7);ctx.clip();if(PHOTO.complete&&PHOTO.naturalWidth)ctx.drawImage(PHOTO,x,y,w,h);else{ctx.fillStyle='#234';ctx.fillRect(x,y,w,h)}ctx.restore()}

function drawHole(h,dt){
  const w=CW*0.84,k=Math.min(1,CH/112);
  // locker behind
  const lx=h.x-w*0.36,lw=w*0.72,lh=CH*0.72,ly=h.y-lh;
  ctx.fillStyle='#3d4250';rr(lx,ly,lw,lh,4);ctx.fill();ctx.fillStyle='#2b2f3a';for(let i=0;i<4;i++)ctx.fillRect(lx+lw*0.2,ly+6+i*5,lw*0.6,2);
  ctx.fillStyle='#ffd400';ctx.globalAlpha=0.5;fit('LOCKER '+(h.i+1),h.x,ly+lh*0.6,8,lw-6,'#ffd400');ctx.globalAlpha=1;
  // hole
  ctx.fillStyle='#0a0a0a';ctx.beginPath();ctx.ellipse(h.x,h.y,w/2,9*k+4,0,0,6.283);ctx.fill();
  const it=h.item;
  if(it){
    const rise=it.ph==='hit'?1:Math.max(0,it.rise),sq=it.ph==='hit'?Math.max(0.15,1-it.hitT*3):1;
    const sc=Math.min(CW/110,CH/120)*(it.boss?1.06:0.98);
    ctx.save();ctx.beginPath();ctx.rect(h.cx-6,h.cy-40,CW+12,h.y-h.cy+40);ctx.clip();
    ctx.translate(h.x,h.y+ (1-rise)*120*sc + (it.ph==='hit'?it.hitT*40:0));ctx.scale(sc*(2-sq)*0.5+sc*0.5,sc*sq);
    drawItem(it,it.t+it.seed*10);
    ctx.restore();
    if(it.ph==='hit'&&it.kind!=='star'){for(let i=0;i<3;i++){const a=gT*8+i*2.1;star5(h.x+Math.cos(a)*22,h.y-CH*0.45+Math.sin(a)*6,5,'#ff4')}}
    // timer ring for caleb/boss
    if(it.ph==='up'&&(it.boss)){ctx.strokeStyle='#ff4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(h.x+CW*0.38,h.cy+12,7,-Math.PI/2,-Math.PI/2+6.283*(1-it.t/it.life));ctx.stroke()}
  }
  // front lip of the hole
  ctx.strokeStyle='#0d3a15';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(h.x,h.y,w/2,9*k+4,0,0.05,Math.PI-0.05);ctx.stroke();
}

function draw(){
  ctx.setTransform(S*DPR,0,0,S*DPR,0,0);ctx.clearRect(0,0,W,H);

  ctx.fillStyle='#0b0b14';ctx.fillRect(-10,-10,W+20,H+20);drawField();
  for(const h of holes)drawHole(h);if(fireT>0)drawFire();
  drawHUD();drawBottom();drawHammers();drawPops();drawConfetti();drawBanner();
  if(state==='hike'){txt(stateT<0.5?'READY':stateT<1?'HUT!':'HIKE!',W/2,FT+(FB-FT)*0.7,44,'#fff','center','#c21')}

  if(flash>0){ctx.fillStyle=flashCol;ctx.globalAlpha=flash*0.3;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
